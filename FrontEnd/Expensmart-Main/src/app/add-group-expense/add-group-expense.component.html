            <div class="card-body px-4 py-5">
              <h2 class="text-center text-white mb-5">Add New Expense</h2>
  
              <form [formGroup]="expenseForm" (ngSubmit)="onSubmit()">


                <div class="form-outline mb-4">
                  <div class="input-group">
                    <button type="button" class="btn btn-outline-secondary dropdown-toggle currency-selector"
                            data-bs-toggle="dropdown">
                      {{ selectCurrency() }}
                    </button>
                    <div class="dropdown-menu">
                      <a class="dropdown-item" *ngFor="let currency of currencies"
                         (click)="changeCurrency(currency.code)">
                        {{ currency.symbol }} {{ currency.code }}
                      </a>
                    </div>
                    <input type="number"
                           formControlName="amount"
                           class="form-control custom-input"
                           [ngClass]="{'is-invalid': expenseForm.get('amount')?.errors && expenseForm.get('amount')?.touched}"
                           step="0.01"
                           min="0">
                  </div>
                  <div class="invalid-feedback" *ngIf="expenseForm.get('amount')?.touched">
                    <span *ngIf="expenseForm.get('amount')?.errors?.['required']">Amount is required</span>
                    <span *ngIf="expenseForm.get('amount')?.errors?.['min']">Amount cannot be negative</span>
                  </div>
                </div>
  
                
                <div class="form-outline mb-4">
                  <input type="date"
                         formControlName="date"
                         class="form-control custom-input"
                         [ngClass]="{'is-invalid': expenseForm.get('date')?.errors && expenseForm.get('date')?.touched}">
                  <div class="invalid-feedback" *ngIf="expenseForm.get('date')?.touched">
                    Date is required
                  </div>
                </div>
  

                <div class="form-outline mb-4">
                  <select formControlName="categoryID"
                          class="form-control custom-input"
                          [ngClass]="{'is-invalid': expenseForm.get('categoryID')?.errors && expenseForm.get('categoryID')?.touched}">
                    <option value="">Select Category</option>
                    <option *ngFor="let category of categories" [value]="category.categoryID">
                      {{ category.name }}
                    </option>
                  </select>
                  <div class="invalid-feedback" *ngIf="expenseForm.get('categoryID')?.touched">
                    Category is required
                  </div>
                </div>

                <div class="form-outline mb-4">
                  <input #fileInput type="file" (change)="onFileSelected($event)" class="form-control custom-input" id="FileInput"/>
                </div>

                <div class="form-outline mb-4">
                  <textarea formControlName="description"
                            class="form-control custom-input"
                            rows="3"
                            placeholder="Description"
                            [ngClass]="{'is-invalid': expenseForm.get('description')?.errors && expenseForm.get('description')?.touched}">
                  </textarea>
                  <div class="char-count" [class.text-danger]="expenseForm.get('description')?.value?.length > 450">
                    {{ expenseForm.get('description')?.value?.length || 0 }}/500
                  </div>
                  <div class="invalid-feedback" *ngIf="expenseForm.get('description')?.touched">
                    <span *ngIf="expenseForm.get('description')?.errors?.['required']">Description is required</span>
                    <span *ngIf="expenseForm.get('description')?.errors?.['maxlength']">Description is too long</span>
                  </div>
                </div>
  
                <div class="form-outline mb-4">
                  <select formControlName="expenseType"
                          class="form-control custom-input"
                          [ngClass]="{'is-invalid': expenseForm.get('expenseType')?.errors && expenseForm.get('expenseType')?.touched}">
                    <option *ngFor="let type of expenseTypes" [value]="type">
                      {{ type }}
                    </option>
                  </select>
                  <div class="invalid-feedback" *ngIf="expenseForm.get('expenseType')?.touched">
                    Expense type is required
                  </div>
                </div>

                <button type="submit"
                        class="btn btn-primary btn-block"
                        [disabled]="expenseForm.invalid || isLoading">
                  <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                  Add Expense
                </button>
              </form>
            </div>
