<section class="background-radial-gradient">
    <div class="currency-container">
        <span class="currency-symbol">$</span>
        <span class="currency-symbol">€</span>
        <span class="currency-symbol">£</span>
        <span class="currency-symbol">₹</span>
        <span class="currency-symbol">¥</span>
        <span class="currency-symbol">₹</span>
        <span class="currency-symbol">€</span>
        <span class="currency-symbol">£</span>
        <span class="currency-symbol">¥</span>
        <span class="currency-symbol">₹</span>
        <span class="currency-symbol">$</span>
        <span class="currency-symbol">€</span>
        <span class="currency-symbol">£</span>
        <span class="currency-symbol">¥</span>
        <span class="currency-symbol">₹</span>
        <span class="currency-symbol">$</span>
        <span class="currency-symbol">€</span>
        <span class="currency-symbol">£</span>
        <span class="currency-symbol">₹</span>  
    </div>
  
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card bg-glass">
            <div class="card-body p-4">
              <h2 class="text-center mb-4 text-light">Split Expense</h2>
  
              <form [formGroup]="expenseForm" (ngSubmit)="onSubmit()" class="animate__animated animate__fadeIn">
                <div class="mb-3">
                  <label class="form-label text-light">Total Amount *</label>
                  <div class="input-group">
                    <span class="input-group-text currency-selector">₹</span>
                    <input type="number" 
                           class="form-control custom-input" 
                           formControlName="totalAmount"
                           [ngClass]="{'is-invalid': expenseForm.get('totalAmount')?.invalid && expenseForm.get('totalAmount')?.touched }">
                  </div>
                  <div class="invalid-feedback " *ngIf="expenseForm.get('totalAmount')?.errors?.['required']">
                    Amount is required
                  </div>
                  <div class="invalid-feedback d-block" *ngIf="expenseForm.get('totalAmount')?.errors?.['min']">
                    Amount must be greater than 0.02
                  </div>
                  <div class="invalid-feedback d-block" *ngIf="expenseForm.get('totalAmount')?.errors?.['max']">
                    Amount cannot be greater than  9999999999999999.99 
                   </div>
                </div>
  
                <div class="mb-3">
                  <label class="form-label text-light">Number of Members *</label>
                  <input type="number" 
                         class="form-control custom-input" 
                         formControlName="numberOfMembers"
                         min="2"
                         [ngClass]="{'is-invalid': expenseForm.get('numberOfMembers')?.invalid && expenseForm.get('numberOfMembers')?.touched}">
                  <div class="invalid-feedback" *ngIf="expenseForm.get('numberOfMembers')?.errors?.['required']">
                    Number of members is required
                  </div>
                  <div class="invalid-feedback d-block" *ngIf="expenseForm.get('numberOfMembers')?.errors?.['min']">
                    At least 2 members are required
                  </div>
                </div>
  
                <div class="mb-3">
                  <label class="form-label text-light">Category *</label>
                  <select class="form-select custom-input" formControlName="categoryId">
                    <option value="">Select Category</option>
                    <option *ngFor="let category of categories" [value]="category.categoryID">
                      {{category.name}}
                    </option>
                  </select>
                </div>
  
                <div class="mb-3">
                  <label class="form-label text-light">Select Users *</label>
                  <input type="text" 
                         class="form-control custom-input" 
                         formControlName="userSearch"
                         placeholder="Type to search users"
                         [ngClass]="{'is-invalid': selectedUsers.length < expenseForm.get('numberOfMembers')?.value && expenseForm.get('numberOfMembers')?.value > 0}">
                  
                  <div class="dropdown-menu show" *ngIf="filteredUsers.length > 0">
                    <button type="button" 
                            class="dropdown-item" 
                            *ngFor="let user of filteredUsers"
                            (click)="selectUser(user)">
                      {{user}}
                    </button>
                  </div>
  
                  <div class="mt-2">
                    <span class="badge bg-primary me-2 mb-2 animate__animated animate__fadeIn" 
                          *ngFor="let user of selectedUsers; let i = index">
                      {{user}}
                      <button type="button" class="btn-close btn-close-white ms-2" 
                              (click)="removeUser(i)"></button>
                    </span>
                  </div>
                </div>
  
                <div class="mb-3">
                  <label class="form-label text-light">Receipt *</label>
                  <input type="file" 
                         class="form-control custom-input"
                         (change)="onFileSelected($event)"
                         accept="image/*">
                </div>
  
                <div class="d-grid">
                  <button type="submit" 
                          class="btn btn-primary"
                          [disabled]="expenseForm.invalid || isSubmitting || selectedUsers.length === 0">
                    <span class="spinner-border spinner-border-sm me-2" *ngIf="isSubmitting"></span>
                    Split Expense
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
