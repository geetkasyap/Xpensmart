    <div class="container">
      <div class="mat-elevation-z8 table-container">
        <table mat-table [dataSource]="dataSource" matSort class="tables">
          <ng-container matColumnDef="startDate">
            <th mat-header-cell *matHeaderCellDef> Start Date </th>
            <td mat-cell *matCellDef="let budget">{{ budget.startDate | date }}</td>
          </ng-container>
  
          <ng-container matColumnDef="endDate">
            <th mat-header-cell *matHeaderCellDef> End Date </th>
            <td mat-cell *matCellDef="let budget">{{ budget.endDate | date }}</td>
          </ng-container>
  
          <ng-container matColumnDef="frequency">
            <th mat-header-cell *matHeaderCellDef > Frequency </th>
            <td mat-cell *matCellDef="let budget">{{ budget.frequency }}</td>
          </ng-container>
  
          <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef> Amount </th>
            <td mat-cell *matCellDef="let budget">
              <ng-container *ngIf="editingBudget?.budgetID === budget.budgetID; else displayAmount">
                <form [formGroup]="editForm">
                  <input type="number" formControlName="amount" class="custom-input">
                </form>
              </ng-container>
              <ng-template #displayAmount>
                ₹{{ budget.amount }}
              </ng-template>
            </td>
          </ng-container>
  
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let budget">
              <ng-container *ngIf="editingBudget?.budgetID!== budget.budgetID; else editActions">
              <button mat-icon-button color="primary" (click)="startEdit(budget)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteBudget(budget.budgetID)">
                <mat-icon>delete</mat-icon>
              </button>
              </ng-container>
              <ng-template #editActions>
              <button mat-icon-button color="primary" (click)="saveEdit()">
                <mat-icon>check</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="cancelEdit()">
                <mat-icon>close</mat-icon>
              </button>
              </ng-template>
            </td>
          </ng-container>
  
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <div *ngIf="dataSource.data.length === 0" class="NoDataMessage">No data</div>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of expenses" class="paginator"></mat-paginator>
      </div>
    </div>
