<nav class="navbar">
  <div class="navbar-brand">
    <a href="http://localhost:8989/Home">
    <img src="../assets/Logo.png" alt="Brand Logo" class="brand-logo"  />
  </a>
  </div>

  <div class="navbar-actions">
    <div class="px-3" style="font-weight: bold;">Hi {{UserName}} !!</div>
    <div class="notification-container">
      <button class="notification-button" (click)="toggleNotifications()">
        <mat-icon>notifications</mat-icon>
        <span *ngIf="unreadCount > 0" class="notification-badge">
          {{ unreadCount }}
        </span>
      </button>

      <div *ngIf="showNotifications" class="notifications-dropdown">
        <div
          *ngFor="let notification of notifications"
          class="notification-item"
          [ngClass]="{
            'gradient-invitation': notification.type === 'invitation',
            'gradient-expense': notification.type === 'expense',
            'gradient-shared-account': notification.type === 'shared_account'
          }"
        >
          <div class="notification-content">
            {{ notification.message }}

            <div
              class="notification-actions"
              *ngIf="
                notification.type === 'invitation' && !notification.readMessage
              "
            >
              <button
                class="accept-btn"
                (click)="acceptInvitation(notification.notificationID)"
              >
                Accept
              </button>
              <button
                class="reject-btn"
                (click)="deleteNotification(notification.notificationID)"
              >
                Reject
              </button>
            </div>
            <div
              class="notification-actions"
              *ngIf="
                notification.type === 'expense' ||
                notification.type === 'shared_account'
              "
            >
              <button
                class="delete-btn"
                (click)="deleteNotification(notification.notificationID)"
              >
                X
              </button>
            </div>
          </div>
        </div>
        <div *ngIf="notifications.length === 0" class="no-notifications">
          No new notifications
        </div>
      </div>
    </div>

    <button class="logout-button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      Logout
    </button>
  </div> 


  
</nav>
